<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1a2a">
  <title>业务分布</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="map-scale.css">
</head>
<body>
  <main class="dashboard">
    <video class="background-video" autoplay muted loop playsinline aria-hidden="true">
      <source src="data/background.mp4" type="video/mp4">
    </video>
    <div class="tech-background" aria-hidden="true">
      <i class="signal-lane lane-a"></i>
      <i class="signal-lane lane-b"></i>
      <i class="signal-lane lane-c"></i>
      <i class="signal-lane lane-d"></i>
    </div>
    <header class="topbar">
      <div class="heading"><h1>业务分布</h1></div>
    </header>

    <section class="workspace" aria-label="全国能源业务分布">
      <section class="map-stage" aria-label="呼和浩特综合能源调度网络地图">
        <div class="map-ripple-field" aria-hidden="true">
          <i class="map-ripple ripple-one"></i>
          <i class="map-ripple ripple-two"></i>
          <i class="map-ripple ripple-three"></i>
        </div>
        <canvas id="three-map-canvas" aria-hidden="true"></canvas>
        <svg id="network-map" viewBox="0 0 1000 760" preserveAspectRatio="xMidYMid meet" role="img" aria-label="中国综合能源业务网络地图">
          <defs>
            <!-- 省份渐变（app.js 中使用） -->
            <linearGradient id="province-gradient" gradientUnits="userSpaceOnUse" x1="150" y1="145" x2="835" y2="660">
              <stop offset="0" stop-color="#176fae"/>
              <stop offset=".43" stop-color="#0a4b91"/>
              <stop offset=".78" stop-color="#07336f"/>
              <stop offset="1" stop-color="#041d4e"/>
            </linearGradient>
            <linearGradient id="depth-gradient" gradientUnits="userSpaceOnUse" x1="180" y1="160" x2="810" y2="690">
              <stop offset="0" stop-color="#0b5f9f"/>
              <stop offset=".5" stop-color="#06356f"/>
              <stop offset="1" stop-color="#02183f"/>
            </linearGradient>
            <!-- 高亮省份渐变 -->
            <linearGradient id="map-gradient-active" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#4ac0e0;stop-opacity:1" />
              <stop offset="50%" style="stop-color:#ffd659;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#4ac0e0;stop-opacity:1" />
            </linearGradient>
            <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="1.5" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <filter id="map-glow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="2.5" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <filter id="route-glow" x="-45%" y="-45%" width="190%" height="190%">
              <feGaussianBlur stdDeviation="3.8" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <g id="map-provinces"></g>
          <g id="network-routes"></g>
          <g id="network-nodes"></g>
        </svg>
      </section>

      <aside id="business-modal" class="business-modal is-open is-overview" aria-live="polite" aria-hidden="false" aria-label="BUSINESS DISTRIBUTION">
        <p class="eyebrow" id="business-eyebrow">BUSINESS OVERVIEW</p>
        <div class="region-index"><span id="region-index">ALL</span><span id="region-total">/ 12</span></div>
        <h2 id="region-name">业务分布</h2>
        <p class="region-category" id="region-category">业务分布</p>
        <div id="project-media" class="project-media" aria-hidden="true"></div>
        <p class="region-copy" id="region-copy">覆盖全国 12 个核心城市，协同服务配电、新能源与综合能源项目。</p>
        <p class="region-details" id="region-details">统筹区域配电装备、新能源配套与综合能源服务。\n形成城市协同、项目联动的业务网络。</p>
        <div class="detail-metric"><span id="region-metric-label">核心节点</span><strong id="region-metric">12 个城市</strong></div>
      </aside>
    </section>

    <footer class="footer-bar">
      <div><span>调度核心</span><b>呼和浩特</b></div>
      <div><span>网络链路</span><b id="network-count">12 / 12</b></div>
      <div><span>实时传输</span><b>1.28 Tbps</b></div>
      <div><span>系统状态</span><b class="healthy">稳定运行</b></div>
    </footer>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="three-map.js"></script>
  <script src="app.js"></script>
</body>
</html>
